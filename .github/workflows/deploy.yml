name: Deploy

# Deploys main to the dev stage: CDK stacks, then migrations, then the frontend.
# The AWS role only trusts main, so this cannot run from other branches.

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - infra/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy halfway
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install infra dependencies
        working-directory: infra
        run: yarn install --frozen-lockfile

      # Builds backend/Dockerfile and pushes it to the CDK assets repository
      - name: Deploy stacks
        working-directory: infra
        run: yarn cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Read stack outputs
        id: outputs
        run: |
          out=infra/cdk-outputs.json
          {
            echo "api_base_url=$(jq -r '."PetStop-Dev-Api".ApiBaseUrl' $out)"
            echo "manage_function=$(jq -r '."PetStop-Dev-Api".ManageFunctionName' $out)"
            echo "frontend_url=$(jq -r '."PetStop-Dev-Storage".FrontendUrl' $out)"
            echo "web_bucket=$(jq -r '."PetStop-Dev-Storage".WebBucketName' $out)"
            echo "distribution_id=$(jq -r '."PetStop-Dev-Storage".DistributionId' $out)"
            echo "cognito_issuer=$(jq -r '."PetStop-Dev-Auth".CognitoIssuer' $out)"
            echo "cognito_client_id=$(jq -r '."PetStop-Dev-Auth".CognitoClientId' $out)"
            echo "cognito_domain=$(jq -r '."PetStop-Dev-Auth".CognitoDomain' $out)"
          } >> "$GITHUB_OUTPUT"

      # load_catalogue upserts the fictional shops and products, so it is safe on every deploy
      - name: Run migrations and load catalogue
        env:
          FUNCTION: ${{ steps.outputs.outputs.manage_function }}
        run: |
          for command in migrate load_catalogue; do
            aws lambda invoke --function-name "$FUNCTION" \
              --cli-binary-format raw-in-base64-out \
              --payload "{\"command\": \"$command\"}" \
              --cli-read-timeout 300 \
              result.json > invoke.json
            jq -r '.output // .' result.json
            # A handler exception still returns HTTP 200; FunctionError marks it
            if jq -e '.FunctionError' invoke.json > /dev/null; then
              echo "::error::$command failed"
              exit 1
            fi
          done

      - name: Check API health
        env:
          API: ${{ steps.outputs.outputs.api_base_url }}
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors "${API}health/"

      # The cart and order flow needs all six seeded shops, Idempotency-Key allowed by
      # the checkout preflight, and the private routes behind the Cognito authorizer
      - name: Check marketplace and order routes
        env:
          API: ${{ steps.outputs.outputs.api_base_url }}
          ORIGIN: ${{ steps.outputs.outputs.frontend_url }}
        run: |
          shops=$(curl --fail --silent --show-error --retry 3 --retry-all-errors "${API}merchants/" | jq '.count')
          echo "Active shops: $shops"
          if [ "$shops" -lt 6 ]; then
            echo "::error::expected 6 active shops, got $shops"
            exit 1
          fi

          allowed=$(curl --silent --show-error --output /dev/null --dump-header - \
            --request OPTIONS "${API}checkout/" \
            --header "Origin: $ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: authorization,content-type,idempotency-key" \
            | tr -d '\r' | grep -i '^access-control-allow-headers:' || true)
          echo "Checkout preflight: ${allowed:-no allow-headers}"
          if ! grep -qi 'idempotency-key' <<< "$allowed"; then
            echo "::error::the checkout preflight does not allow Idempotency-Key"
            exit 1
          fi

          for path in cart/ checkout/ orders/; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "${API}${path}")
            echo "GET $path without a token: $status"
            if [ "$status" != 401 ]; then
              echo "::error::$path must require sign-in (expected 401, got $status)"
              exit 1
            fi
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_DATA_SOURCE: api
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.outputs.outputs.api_base_url }}
          NEXT_PUBLIC_COGNITO_ISSUER: ${{ steps.outputs.outputs.cognito_issuer }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.outputs.outputs.cognito_client_id }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.outputs.outputs.cognito_domain }}
          NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${{ steps.outputs.outputs.frontend_url }}/auth/callback/
          NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${{ steps.outputs.outputs.frontend_url }}/
        run: yarn build

      # Hashed assets first and cached for a year; pages after, revalidated on every
      # visit, so a page never points at an asset that has not been uploaded yet
      - name: Upload frontend
        working-directory: frontend
        env:
          BUCKET: ${{ steps.outputs.outputs.web_bucket }}
        run: |
          aws s3 sync out/_next/static "s3://$BUCKET/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync out/ "s3://$BUCKET" --delete \
            --exclude "_next/static/*" --cache-control "no-cache"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION: ${{ steps.outputs.outputs.distribution_id }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
