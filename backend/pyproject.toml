[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, DJ flake8-django, S bandit
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S"]
# Line length is left to the formatter
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# assert is normal in tests
"**/tests/**" = ["S101"]
"**/tests.py" = ["S101"]
