[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff.lint]
# pycodestyle, Pyflakes, import sorting, pyupgrade, bugbear, Django
select = ["E", "F", "I", "UP", "B", "DJ"]
# Line length is handled by the formatter.
ignore = ["E501"]
