services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: petstop
      POSTGRES_USER: petstop
      POSTGRES_PASSWORD: petstop # local only
    ports:
      - "127.0.0.1:${PETSTOP_DB_PORT:-5432}:5432" # set PETSTOP_DB_PORT (shell or root .env) if 5432 is taken
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petstop"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
